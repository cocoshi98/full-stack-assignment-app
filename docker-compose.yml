services:
  postgres:
    image: postgres:16
    container_name: task-assignment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp_password
      POSTGRES_DB: task_assignment

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: